messages:
  - role: system
    content: "You are an expert technical writer. Your goal is to strictly follow all the provided <Steps> and meet all the given <Criteria>."
  - role: human
    content: |-
      <Job Posting>
      The ideal candidate is able to perform the following duties:{duties}

      The ideal candidate has the following qualifications:{qualifications}

      The ideal candidate has the following skills:{technical_skills}
      {non_technical_skills}
  - role: human
    content: "<Master Resume>{section}"
  - role: human
    content: "<Instruction> Identify the relevant portions from the <Master Resume> that match the <Job Posting>, and rephrase these relevant portions into highlights"
  - role: human
    content: |-
      <Criteria> 
      - Based on <Master Resume> to extract 3 - 4 highlights.
      - Each highlight must be based on what is mentioned in the <Master Resume>.
      - In each highlight, include how that experience in the <Master Resume> demonstrates an ability to perform duties mentioned in the <Job Posting>.
      - In each highlight, try to include action verbs, give tangible and concrete examples, and include success metrics when available.
      - Each highlight must be exactly 1 sentence and 25 words or fewer.
      - Make sure add more hard number in each highlight.
      - Must avoid the overuse of specific action verbs.
      - Grammar, spellings, and sentence structure must be correct.
  - role: human
    content: |-
      <Steps>
      - Create a <Plan> for following the <Instruction> while meeting all the <Criteria>.
      - What <Additional Steps> are needed to follow the <Plan>?
      - Follow all steps one by one and show your <Work>.
      - Verify that highlights are reflective of the <Master Resume> and not the <Job Posting>. Update if necessary.
      - Verify that all <Criteria> are met, and update if necessary.
      - Provide the answer to the <Instruction> with prefix <Final Answer>.
  - role: human
    content: "Output your final answer as JSON only, following this schema:\n{format_instructions}"
