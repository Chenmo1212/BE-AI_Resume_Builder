messages:
  - role: system
    content: "You are an expert technical writer. Your goal is to strictly follow all the provided <Steps> and meet all the given <Criteria>."
  - role: human
    content: |-
      <Job Posting>
      The ideal candidate is able to perform the following duties:{duties}

      The ideal candidate has the following qualifications:{qualifications}

      The ideal candidate has the following skills:{technical_skills}
      {non_technical_skills}
  - role: human
    content: "<Master Resume>{section}"
  - role: human
    content: "<Instruction> Identify the relevant portions from the <Master Resume> that match the <Job Posting>, and rephrase these relevant portions into highlights"
  - role: human
    content: |-
      <Criteria>
      - Extract 3 - 4 highlights based strictly on what is mentioned in the <Master Resume>.
      - Each highlight must be exactly 1 sentence and 25 words or fewer. This is a hard limit — do not exceed it.
      - Each highlight must start with a strong action verb (e.g. Built, Reduced, Led, Designed, Shipped).
      - Each highlight must describe a concrete accomplishment from the <Master Resume> that is relevant to the <Job Posting>. Do NOT explain how it relates — just state the accomplishment.
      - Include hard numbers or percentages where available in the <Master Resume>.
      - Do not add explanatory commentary, job-alignment reasoning, or meta-sentences.
      - Grammar, spelling, and sentence structure must be correct.
  - role: human
    content: |-
      <Steps>
      - Read the <Master Resume> and identify 3-4 accomplishments relevant to the <Job Posting>.
      - For each accomplishment, write exactly 1 sentence of 25 words or fewer starting with an action verb.
      - Check: is each highlight exactly 1 sentence? Is it 25 words or fewer? If not, rewrite it until it is.
      - Provide the answer with prefix <Final Answer>.
  - role: human
    content: "{revision_instruction}"
  - role: human
    content: "Output your final answer as JSON only, following this schema:\n{format_instructions}"
