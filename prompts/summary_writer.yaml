messages:
  - role: system
    content: "You are an expert technical writer. Your goal is to strictly follow all the provided <Steps> and meet all the given <Criteria>."
  - role: human
    content: |-
      <Job Posting>
      {company}
      {job_summary}
  - role: human
    content: |-
      <Resume>
      Education:{degrees}

      Experience:{projects}
      {experiences}

      Skills:{skills}
  - role: human
    content: "<Instruction> Create a Professional Summary from my <Resume>."
  - role: human
    content: |-
      <Criteria>
      - Before writing, classify the Job Posting as technical/IC or management/leadership. For technical/IC roles, lead the summary with technical specialization and system or domain expertise. For management/leadership roles, lead with scope of ownership (team size, cross-functional scope) and business outcomes.
      - The Resume is the source of truth. The Job Posting only determines which resume-supported content is most relevant — never introduce experience, skills, or traits that are not supported by the Resume.
      - Specify the field in which the candidate has expertise and mention the duration of their experience.
      - The summary should communicate the candidate's strongest professional positioning and 1–2 differentiators. Use a concrete achievement when it strengthens that positioning, but do not force an achievement into the summary if it makes the summary less coherent. A strong differentiator may be a technical specialization, a domain, a system type, or a combination of skills — not necessarily a single metric.
      - For technical/IC roles, open with technical specialization and domain expertise, then reinforce it with measurable impact if available. For management/leadership roles, open with scope of ownership and business outcomes, then reinforce with technical/domain context if relevant. Ownership and scope/complexity remain secondary supporting details in both cases.
      - Do not use generic self-evaluative phrases such as "strong work ethic", "passionate", "dedicated", "highly skilled", "proven ability", or "strong ability". Let concrete evidence imply these qualities.
      - Do not turn the summary into a cover letter. Do not mention the target company name or job title unless it reads naturally and adds clear value.
      - Use keywords from the Job Posting only when they are already supported by the Resume.
      - The summary must be concise, comprising 3–4 sentences totaling 50–80 words. Do not use the first-person pronoun "I".
      - Ensure correct grammar, spelling, and sentence structure for a polished presentation.
  - role: human
    content: |-
      <Steps>
      - Identify the candidate's strongest professional positioning from the <Resume>: their specialization, years of experience, and 1–2 differentiators most relevant to the <Job Posting>.
      - Write a professional summary that leads with that positioning. Include a concrete achievement or differentiator only if it fits naturally and strengthens the positioning.
      - Count the words. The summary must be between 50 and 80 words — rewrite until it is.
      - Check: does it avoid "I"? Does it avoid generic self-evaluative filler? Does it avoid duplicating what the Highlights already say? Does it establish a clear professional identity?
  - role: human
    content: "{revision_instruction}"
  - role: human
    content: "Output your final answer as JSON only, following this schema:\n{format_instructions}"
