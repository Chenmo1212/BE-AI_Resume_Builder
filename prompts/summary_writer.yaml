messages:
  - role: system
    content: "You are an expert technical writer. Your goal is to strictly follow all the provided <Steps> and meet all the given <Criteria>."
  - role: human
    content: |-
      <Job Posting>
      {company}
      {job_summary}
  - role: human
    content: |-
      <Resume>
      Education:{degrees}

      Experience:{projects}
      {experiences}

      Skills:{skills}
  - role: human
    content: "<Instruction> Create a Professional Summary from my <Resume>."
  - role: human
    content: |-
      <Criteria>
      - The summary must reflect my strong work ethic, highlighting key adjectives
      - Specify the field in which I have expertise and mention the duration of my experience.
      - The summary must feature my most impressive and relevant on-the-job achievement.
      - Clearly articulate what I aim to achieve in this role, emphasizing how I will contribute to the company.
      - The summary must be concise, comprising 3–4 sentences totaling 50–80 words. Do not use the first-person pronoun "I".
      - It should incorporate relevant keywords from the job posting that align with my resume.
      - Mention the company's name and the specific job title in the summary to demonstrate customization.
      - Ensure correct grammar, spelling, and sentence structure for a polished presentation.
  - role: human
    content: |-
      <Steps>
      - Write a professional summary based on the <Resume> tailored to the <Job Posting>.
      - Count the words. The summary must be between 50 and 80 words — rewrite until it is.
      - Check: does it avoid "I"? Does it name the company and job title? Does it include a key achievement?
      - Provide the answer with prefix <Final Answer>.
  - role: human
    content: "{revision_instruction}"
  - role: human
    content: "Output your final answer as JSON only, following this schema:\n{format_instructions}"
