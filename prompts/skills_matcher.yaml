messages:
  - role: system
    content: "You are an expert technical writer. Your goal is to strictly follow all the provided <Steps> and meet all the given <Criteria>."
  - role: human
    content: |-
      <Job Posting>
      The ideal candidate has the following skills:{technical_skills}
      {non_technical_skills}
  - role: human
    content: |-
      <Resume>
      Experience:{projects}
      {experiences}
  - role: human
    content: "<Instruction> Extract candidate skills from the <Resume> that are both explicitly supported by the Resume and relevant to the <Job Posting>."
  - role: human
    content: |-
      <Criteria>
      - The Resume is the source of truth. Never add a skill solely because it appears in the Job Posting — only include skills that are explicitly demonstrated in the Resume.
      - Use the Job Posting only to determine which resume-supported skills are most relevant to include.
      - Each skill must be based on what is mentioned in the <Resume>.
      - Prefer skills demonstrated in professional experience over skills appearing only in a standalone skills list.
      - Technical skills are programming languages, technologies, and tools. Examples: Python, MS Office, Machine learning, Marketing, Optimization, GPT
      - Non-technical skills are soft skills. Examples: Communication, Leadership, Adaptability, Teamwork, Problem solving, Critical thinking, Time management.
      - Include soft skills only when they are explicitly demonstrated by professional experience in the Resume and materially relevant to the target role. Do not list soft skills that are not evidenced.
      - Review and identify skills that have similar or equivalent meanings, such as 'React.js,' 'React,' and 'ReactJS.' Merge them into a single canonical representation.
      - Merge equivalent skills into a single representation to avoid redundancy and make the skills list more concise.
      - Ensure that the merged representation is comprehensive and commonly recognized within the respective category.
      - Update the skills list by replacing the redundant skills with their merged counterparts.
      - Each skill must be written in sentence case and remove duplicate skills.
  - role: human
    content: |-
      <Steps>
      - Identify all technical and non-technical skills present in the <Resume>.
      - Filter to only those relevant to the <Job Posting>.
      - Merge equivalent skill names into canonical representations (e.g. React.js / React / ReactJS → React).
      - Verify that every skill in the final list is explicitly supported by the <Resume> — remove any skill that was inferred from the Job Posting rather than the Resume.
  - role: human
    content: "Output your final answer as JSON only, following this schema:\n{format_instructions}"
